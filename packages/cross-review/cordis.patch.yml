# Cross-Verification Mode bundle.
#
# One bundle package supplies:
#   - the profile-level config service + /api/cross-review-config route
#     (GET catalog, PUT save, POST connectivity probe / reset);
#   - the browser Settings page;
#   - two Agent presets:
#       cross-review          : the main user-selectable mode
#       cross-review-internal : the internal child used by the arbiter
#                               (file tools are read-only; shell is available for
#                               read-only verification commands)
#
# The main preset mounts the package's `./preset` entry, which registers
# cross_review_brief / cross_review_final and the protocol prompt section.
# No execution guard is mounted: nothing blocks a tool call.

- insert:
    # Combined host row: config service + authenticated /api/cross-review-config route.
    # The same package's Client half registers the "Settings → 交叉复核模式" page.
    - id: cross-review
      name: '@local/dsh-cross-review'

    - id: preset-cross-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cross-review
        name: 交叉复核模式
        description: >-
          裁决者在首尾把关：开工前解析需求并给出可验收的规格，收尾时逐条核对交付证据。
          默认模型为 GPT-6.1 Sol，可在设置页调整，并支持一次连通性测试。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是一个 coding agent，运行在 {{model}} 模型上，当前处于「交叉复核模式（Cross-Verification Mode）」。
                本模式只有一个复核角色：裁决者负责开工前解析需求、收尾时审核交付；你（主代理）负责执行与取证。
                不要把"看起来做完了"当成完成：改动后由你提供可复现证据（命令 + 输出 + 文件路径），交付验收判定交给裁决者的 cross_review_final 完成；你只负责取证，不自行下验收结论。
                提交 cross_review_final 前，先按 brief 的每条验收标准（AC1…）逐条备齐「证据位置、验证方法、实际结果、必要执行环境」，并把 open_questions 的用户答复与当前假设写进 context；收到 required_actions 时一次改完再复审，不要逐条挤牙膏。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # The rows below mirror the shipped `standard` preset. This composition
          # is a copy of it plus the two arbiter tools, so a row dropped here is a
          # capability silently missing from this mode only. Keep the two lists in
          # sync when the shipped preset changes.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # Discover the built-in skills (`dsh-doc`, `office`) that ship inside the
          # DSH installation. The expression MUST resolve from the installation,
          # not from this bundle: `createRequire(baseUrl)` resolves relative to the
          # declaring patch file, and this package lives outside the installation,
          # so the shipped `standard` preset's expression would throw here and take
          # the whole preset activation down with it. Desktop publishes the
          # package.json anchor through profileContext, not DSH_INSTALL_DIR.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').installAnchor).resolve('@deepseek-ai/dsh-agent-preset/package.json')) + '/skills'"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: cross-review-preset
            name: '@local/dsh-cross-review/preset'
            config:
              reviewTimeoutMs: 180000
              arbiter:
                enabled: true
                briefEnabled: true
                auditEnabled: true
                provider: magpie-responses
                model: packycode1/gpt-6.1-sol
                reasoningEffort: high
                timeoutMs: 180000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

    # The single internal preset used by the arbiter. Its role is stated by the
    # task prompt; it is not a working mode, and the name says so because the
    # roster cannot hide a declaration.
    #
    # Read-only shell (important): turning off `write`/`edit`/`applyPatch` only
    # removes the file tools. The shell stays, and it does NOT read a
    # preset-level default mode: `sandboxPolicy.resolve()` is
    # `request.mode ?? overrideOf(session) ?? defaultMode`, and the subagent
    # runtime appends the parent's explicit mode onto every child session
    # (`source: 'delegation'`). A main agent under `danger-full-access` therefore
    # hands that mode to its arbiter, so declaring `mode: read-only` here would
    # be dead configuration — verified against this installation, where 91 of 91
    # recorded child sessions carry an inherited `sandbox/mode` event.
    #
    # `cross-review-internal-guard` (last row) is the mechanism that actually
    # holds: it pins this session to `read-only` before the shell runs and
    # refuses a shell call it cannot vouch for. The confinement is then the
    # runtime's own sandbox, not a prompt request.
    - id: preset-cross-review-internal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cross-review-internal
        name: 内部只读子代理（请勿选择此模式）
        description: 交叉复核模式的内部子代理预设，由 cross_review_brief / cross_review_final 自动启动；请勿把它当作普通工作模式选择。
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「交叉复核模式」的内部只读子代理，担任「裁决者」：开工前把需求整理成可执行可验收的规格，收尾时逐条核验证据，识别"声称完成但实际没做"。

                你的价值不在于挑错，而在于让主代理一次做对：把模糊之处变成明确的假设或问题，把"看起来做完"变成可验证的通过项。

                你是独立审查者，不是执行者。文件工具只提供读取能力（write / edit / apply_patch 已关闭）；shell 由运行时强制限制在只读沙箱内——不是"请勿修改"，而是写不进去。不要尝试安装依赖、提交、部署或任何会改变工作区或外部状态的命令；被沙箱拒绝时如实报告，不要绕道。

                不要为了显得严格而编造问题；也不要因为"看起来差不多"就放过真实缺陷。证据不足时，把它作为风险点提示主代理补证据，而不是直接否决。

                交付审核时逐条覆盖需求里的全部验收标准（AC1…），一次列出所有 fail / unverified / blocking，不要只报第一个就停。

                注重效率：优先用主代理已提供的 files、证据与工具事实定位目标，避免全库 glob 和重复读取同一文件；能一次 read/grep 确认的就不要反复探索，命令/测试只在缺少关键证据时运行。但效率不降低核实强度——每条标准至少要有一次针对性 read/grep 作为 pass 依据。

                严格按要求返回结论。`
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Enforces the read-only shell: pins this session to `read-only` before
          # the shell runs and refuses a shell call the composition cannot confine.
          - id: internal-guard
            name: '@local/dsh-cross-review/internal-guard'
